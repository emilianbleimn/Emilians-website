<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EB Solutions — Moderne Websites, persönlich gemacht</title>
  <meta name="description" content="EB Solutions gestaltet moderne, professionelle Websites – klar, durchdacht und persönlich umgesetzt. Von der Landingpage bis zur Firmen-Website." />
  <meta name="theme-color" content="#0A0A0B" />
  <script>
    /* Theme früh setzen, um Aufblitzen zu vermeiden */
    (function () {
      try {
        var t = localStorage.getItem('eb-theme');
        if (t !== 'light' && t !== 'dark') { t = 'dark'; }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="EB Solutions — Moderne Websites, persönlich gemacht" />
  <meta property="og:description" content="Moderne, professionelle Websites – persönlich umgesetzt. Von der Landingpage bis zur Firmen-Website." />
  <meta property="og:locale" content="de_DE" />
  <meta property="og:site_name" content="EB Solutions" />
  <meta property="og:url" content="https://ebsolutions.info/" />
  <link rel="canonical" href="https://ebsolutions.info/" />
  <meta name="robots" content="index, follow" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Schriften nicht renderblockierend laden: sonst bleibt der Bildschirm
       leer, bis Google Fonts antwortet, und das Intro "poppt" dann rein. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" /></noscript>
  <!-- Kritisches CSS: verhindert Aufblitzen von unstyled HTML (FOUC) beim Laden/Reload -->
  <style>
    /* Farbschema sofort setzen, damit der Browser schon den allerersten
       Frame dunkel zeichnet und nicht kurz weiss aufblitzt. */
    :root { color-scheme: dark; }
    html[data-theme="light"] { color-scheme: light; }
    html { background: #0A0A0B; }
    html[data-theme="light"] { background: #FBF9F4; }
    body { margin: 0; }

    /* Logo-Intro: vollstaendig hier definiert. Spaeter geladenes CSS darf das
       Intro nicht mehr veraendern, sonst wird es neu gezeichnet (Flackern). */
    .preloader { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
      background: #0A0A0B; font-family: Georgia, 'Times New Roman', serif;
      /* line-height und Glaettung fest setzen: styles.css bringt spaeter andere
         Werte auf body mit, sonst wuerde das Intro noch einmal umbrechen. */
      line-height: 1.2; -webkit-font-smoothing: antialiased;
      transition: opacity .6s ease, visibility .6s ease;
      animation: plSafety 0s linear 4s forwards; }
    html[data-theme="light"] .preloader { background: #FBF9F4; }
    .preloader.hide { opacity: 0; visibility: hidden; }
    .preloader-inner { display: flex; flex-direction: column; align-items: center; gap: 1.1rem; padding: 1rem; }
    .preloader-mark { display: grid; place-items: center; width: 88px; height: 88px; border-radius: 22px;
      background: linear-gradient(135deg, #A98C3F 0%, #C2A24E 100%); color: #14110a;
      font-weight: 800; font-size: 2.3rem; letter-spacing: .02em;
      box-shadow: 0 12px 34px rgba(212, 175, 55, .4); }
    .preloader-word { font-weight: 700; font-size: 1.45rem; letter-spacing: .04em; color: #C2A24E; }
    html[data-theme="light"] .preloader-word { color: #8A6A1E; }
    .preloader-bar { width: 150px; height: 2px; border-radius: 2px; background: rgba(212, 175, 55, .2); overflow: hidden; }
    .preloader-bar i { display: block; height: 100%; width: 42%; border-radius: 2px;
      background: linear-gradient(135deg, #A98C3F, #C2A24E); animation: plBar 1.1s ease-in-out infinite; }
    @keyframes plBar { 0% { transform: translateX(-130%); } 100% { transform: translateX(360%); } }
    @keyframes plSafety { to { opacity: 0; visibility: hidden; } }
  </style>
</head>
<body>
  <!-- Intro / Logo-Splash (bei jedem Laden) – statisch, damit es sofort sichtbar ist -->
  <div id="preloader" class="preloader" role="status" aria-label="Lädt …">
    <div class="preloader-inner">
      <span class="preloader-mark">EB</span>
      <span class="preloader-word">EB Solutions</span>
      <span class="preloader-bar"><i></i></span>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
