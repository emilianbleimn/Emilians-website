  <script>
    /* Theme früh setzen, um Aufblitzen zu vermeiden */
    (function () {
      try {
        var t = localStorage.getItem('eb-theme');
        if (t !== 'light' && t !== 'dark') { t = 'dark'; }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>

  <!-- Kritisches CSS: verhindert Aufblitzen von unstyled HTML (FOUC) beim Laden/Reload -->
  <style>
    /* Farbschema sofort setzen, damit der Browser schon den allerersten
       Frame dunkel zeichnet und nicht kurz weiss aufblitzt. */
    :root { color-scheme: dark; }
    html[data-theme="light"] { color-scheme: light; }
    html { background: #0A0A0B; }
    html[data-theme="light"] { background: #FBF9F4; }
    body { margin: 0; }

    /* Logo-Intro. Steht bewusst vollstaendig hier im <head>: spaeter
       geladenes CSS kann es dadurch nicht mehr veraendern. Es gibt kein
       Einblenden und keine Animation beim Erscheinen - das Logo ist im
       allerersten Bild fertig da und wird nur einmal ausgeblendet.
       Das Logo ist ein Vektor, haengt also an keiner Schrift und an
       keiner nachgeladenen Datei. */
    .splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
      background: #0A0A0B; line-height: 1;
      transition: opacity .5s ease, visibility .5s ease;
      animation: splashOff 0s linear 3.5s forwards; }
    html[data-theme="light"] .splash { background: #FBF9F4; }
    .splash.hide { opacity: 0; visibility: hidden; }
    .splash-inner { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; padding: 1rem; }
    .splash-mark { display: grid; place-items: center; width: 96px; height: 96px; border-radius: 24px;
      background: linear-gradient(135deg, #A98C3F 0%, #C2A24E 100%); color: #14110a; }
    .splash-mark svg { width: 48px; height: auto; display: block; }
    .splash-word { display: block; width: 186px; color: #C2A24E; }
    html[data-theme="light"] .splash-word { color: #8A6A1E; }
    .splash-word svg { width: 100%; height: auto; display: block; }
    @keyframes splashOff { to { opacity: 0; visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) { .splash { transition: none; } }
  </style>
