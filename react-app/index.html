<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EB Solutions — Moderne Websites, persönlich gemacht</title>
  <meta name="description" content="EB Solutions gestaltet moderne, professionelle Websites – klar, durchdacht und persönlich umgesetzt. Von der Landingpage bis zur Firmen-Website." />
  <meta name="theme-color" content="#0A0A0B" />
  <script>
    /* Theme früh setzen, um Aufblitzen zu vermeiden */
    (function () {
      try {
        var t = localStorage.getItem('eb-theme');
        if (t !== 'light' && t !== 'dark') { t = 'dark'; }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="EB Solutions — Moderne Websites, persönlich gemacht" />
  <meta property="og:description" content="Moderne, professionelle Websites – persönlich umgesetzt. Von der Landingpage bis zur Firmen-Website." />
  <meta property="og:locale" content="de_DE" />
  <meta property="og:site_name" content="EB Solutions" />
  <meta property="og:url" content="https://ebsolutions.info/" />
  <link rel="canonical" href="https://ebsolutions.info/" />
  <meta name="robots" content="index, follow" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Schriften nicht renderblockierend laden: sonst bleibt der Bildschirm
       leer, bis Google Fonts antwortet. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" /></noscript>
  <!-- Kritisches CSS: verhindert Aufblitzen von unstyled HTML (FOUC) beim Laden/Reload -->
  <style>
    /* Farbschema sofort setzen, damit der Browser schon den allerersten
       Frame dunkel zeichnet und nicht kurz weiss aufblitzt. */
    :root { color-scheme: dark; }
    html[data-theme="light"] { color-scheme: light; }
    html { background: #0A0A0B; }
    html[data-theme="light"] { background: #FBF9F4; }
    body { margin: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
